name: Nightly

# A signed nightly build of main, published as a GitHub pre-release (tag v<next patch>-nightly.<N>). It is the only
# workflow that holds the release signing key. The key lives in the `nightly-signing` environment, which must be limited
# to the main branch (Settings > Environments > nightly-signing > Deployment branches), so a workflow edited on any other
# branch or fork cannot read it. Runs daily and builds only when main has a commit that no nightly covers and CI is green on it.
on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nightly
  cancel-in-progress: false

env:
  KEEP_NIGHTLIES: "7"

jobs:
  nightly:
    # a scheduled run only ever uses the default branch; a manual one from another branch is refused here and by the environment
    if: github.ref == 'refs/heads/main' && github.repository_owner == 'marcellocgg03'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: nightly-signing
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Decide whether a nightly is due
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          last="$(git tag --list 'v[0-9]*' | grep -v -- '-' | sort -V | tail -n 1 || true)"
          [ -n "$last" ] || { echo "::notice::no stable tag yet"; echo "build=no" >> "$GITHUB_OUTPUT"; exit 0; }
          # a nightly already covers this commit
          if git tag --points-at "$SHA" | grep -q -- '-nightly\.'; then
            echo "::notice::main is already built as a nightly"; echo "build=no" >> "$GITHUB_OUTPUT"; exit 0
          fi
          n="$(git rev-list --count "$last..$SHA")"
          if [ "$n" -lt 1 ]; then echo "::notice::no commits since $last"; echo "build=no" >> "$GITHUB_OUTPUT"; exit 0; fi
          [ "$n" -le 999 ] || n=999
          # only a commit CI passed on
          ok="$(gh run list --repo "${{ github.repository }}" --workflow ci.yml --commit "$SHA" --status success --json databaseId --jq 'length')"
          if [ "$ok" -lt 1 ]; then echo "::warning::CI has no green run on $SHA; no nightly"; echo "build=no" >> "$GITHUB_OUTPUT"; exit 0; fi
          base="${last#v}"
          IFS=. read -r major minor patch <<< "$base"
          echo "build=yes" >> "$GITHUB_OUTPUT"
          echo "number=$n" >> "$GITHUB_OUTPUT"
          echo "version=$major.$minor.$((patch + 1))-nightly.$n" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        if: steps.plan.outputs.build == 'yes'
        with:
          distribution: temurin
          java-version: "21"

      - name: Install Android SDK packages
        if: steps.plan.outputs.build == 'yes'
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37.0" "build-tools;36.0.0"

      # No Gradle cache here: a cache written by a pull-request build must never reach a job that holds the signing key.
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        if: steps.plan.outputs.build == 'yes'
        with:
          cache-disabled: true

      - name: Build and sign
        if: steps.plan.outputs.build == 'yes'
        env:
          KEYSTORE_B64: ${{ secrets.DIALUP_KEYSTORE_B64 }}
          DIALUP_KEYSTORE_PASSWORD: ${{ secrets.DIALUP_KEYSTORE_PASSWORD }}
          DIALUP_KEY_ALIAS: ${{ secrets.DIALUP_KEY_ALIAS }}
          DIALUP_KEY_PASSWORD: ${{ secrets.DIALUP_KEY_PASSWORD }}
          NUMBER: ${{ steps.plan.outputs.number }}
        run: |
          set -euo pipefail
          for v in KEYSTORE_B64 DIALUP_KEYSTORE_PASSWORD DIALUP_KEY_ALIAS DIALUP_KEY_PASSWORD; do
            [ -n "${!v}" ] || { echo "::error::secret for $v is not set in the nightly-signing environment"; exit 1; }
          done
          ks="$RUNNER_TEMP/dialup-nightly.jks"
          printf '%s' "$KEYSTORE_B64" | base64 -d > "$ks"
          chmod 600 "$ks"
          export DIALUP_KEYSTORE_FILE="$ks"
          ./gradlew :app:assembleRelease -PnightlyBuild="$NUMBER"
          rm -f "$ks"

      - name: Verify the APK
        if: steps.plan.outputs.build == 'yes'
        env:
          VERSION: ${{ steps.plan.outputs.version }}
        run: |
          set -euo pipefail
          apk="$(ls app/build/outputs/apk/release/*.apk | head -n 1)"
          aapt2="$(ls "$ANDROID_HOME"/build-tools/*/aapt2 | tail -n 1)"
          apksigner="$(ls "$ANDROID_HOME"/build-tools/*/apksigner | tail -n 1)"
          "$aapt2" dump badging "$apk" | head -n 1 | grep -q "name='dev.dialup' " || { echo "::error::wrong package"; exit 1; }
          "$aapt2" dump badging "$apk" | head -n 1 | grep -q "versionName='$VERSION'" || { echo "::error::wrong versionName"; exit 1; }
          "$apksigner" verify --print-certs "$apk" | grep -E 'Signer #1 certificate (DN|SHA-256)'
          cp "$apk" "DialUP-$VERSION.apk"
          sha256sum "DialUP-$VERSION.apk" > "DialUP-$VERSION.apk.sha256"

      - name: Publish the pre-release and prune old nightlies
        if: steps.plan.outputs.build == 'yes'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.plan.outputs.version }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          tag="v$VERSION"
          gh release create "$tag" "DialUP-$VERSION.apk" "DialUP-$VERSION.apk.sha256" \
            --repo "${{ github.repository }}" --target "$SHA" --prerelease --title "DialUP $VERSION (nightly)" \
            --notes "Nightly build of main at $SHA. Signed with the release key, so it installs over the stable app and the next stable release installs over it. It can be unstable. Choose Stable or Nightly under Settings > App updates. SHA-256 of the APK is in the attached .sha256 file."
          # keep the newest KEEP_NIGHTLIES; the app reads only the newest 30 releases, so old nightlies must not crowd out stable ones
          gh release list --repo "${{ github.repository }}" --limit 100 --json tagName,createdAt \
            --jq '[.[] | select(.tagName | test("-nightly\\."))] | sort_by(.createdAt) | reverse | .['"$KEEP_NIGHTLIES"':][].tagName' |
            while read -r old; do
              [ -n "$old" ] && gh release delete "$old" --repo "${{ github.repository }}" --cleanup-tag --yes
            done
