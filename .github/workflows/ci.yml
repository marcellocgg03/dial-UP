name: CI

on:
  pull_request:
  push:
    branches: [main]

# Read-only token for every job. No job here uses a secret; the signed nightly build is its own workflow (nightly.yml).
permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build-test:
    name: build-test
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Fail if a private planning path is tracked
        run: |
          bad="$(git ls-files | grep -E '^(\.planning/|\.claude/|\.gsd/)|(^|/)CLAUDE\.md$' || true)"
          if [ -n "$bad" ]; then
            echo "::error::Private planning paths must not be part of the public tree:"
            echo "$bad"
            exit 1
          fi

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "21"

      - name: Install Android SDK packages
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37.0" "build-tools;36.0.0"

      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      # The media and renderer tests that start a real ffmpeg look for it on PATH and are skipped when it is missing;
      # without this step a runner image without it would report them skipped and stay green.
      - name: Install ffmpeg for the process tests
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg
          command -v ffmpeg ffprobe
          ffmpeg -version | head -n 1

      - name: Unit tests
        run: ./gradlew test

      # A skipped test counts as green to Gradle; this fails the job when one that should have run (ffmpeg missing) was skipped.
      - name: No unexpected skipped tests
        run: python3 tools/check-skipped-tests.py

      - name: Debug APK
        run: ./gradlew :app:assembleDebug

      - name: Label the debug APK
        id: label
        env:
          EVENT: ${{ github.event_name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PUSH_SHA: ${{ github.sha }}
        run: |
          version="$(sed -nE 's/^[[:space:]]*versionName[[:space:]]*=[[:space:]]*"([^"]+)".*/\1/p' app/build.gradle.kts | head -n 1)"
          if [ "$EVENT" = "pull_request" ]; then
            label="pr${PR_NUMBER}-${PR_HEAD_SHA:0:7}"
          else
            label="main-${PUSH_SHA:0:7}"
          fi
          echo "name=DialUP-${version}-${label}-debug" >> "$GITHUB_OUTPUT"

      # An artifact of the run, not a release: nothing is added to the Releases page. It installs next to the release app
      # (package dev.dialup.debug, debug-signed); GitHub asks you to sign in to download an artifact.
      - name: Upload the debug APK
        id: upload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ steps.label.outputs.name }}
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Link the debug APK in the run summary
        run: |
          echo "### Debug APK" >> "$GITHUB_STEP_SUMMARY"
          echo "[Download ${{ steps.label.outputs.name }}](${{ steps.upload.outputs.artifact-url }}) (debug-signed, package dev.dialup.debug, kept 14 days)" >> "$GITHUB_STEP_SUMMARY"

      - name: Release APK (unsigned without signing material)
        run: ./gradlew :app:assembleRelease

      - name: Check documents
        run: python3 -I tools/check-docs.py

      - name: Python tool self-tests
        run: |
          python3 -I tools/evidence-summary.py --self-test
          python3 -I tools/lounge-fixtures.py --self-test
          python3 -I tools/test-history.py --self-test

  lint:
    name: lint
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "21"

      - name: Install Android SDK packages
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37.0" "build-tools;36.0.0"

      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      - name: Android lint
        run: ./gradlew :app:lintDebug

      - name: Upload lint reports
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: lint-reports
          path: app/build/reports
          retention-days: 7

  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Secret scan (history and tree)
        run: tools/gitleaks.sh scan
