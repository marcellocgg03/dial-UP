name: Feature request
description: Suggest an idea or an improvement
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do that is hard or impossible today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: What would you like to happen?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
    validations:
      required: false
  - type: dropdown
    id: contribute
    attributes:
      label: Would you like to work on it?
      options:
        - "Yes, I can open a pull request"
        - "Maybe, with some guidance"
        - "No, I am only suggesting it"
    validations:
      required: true
